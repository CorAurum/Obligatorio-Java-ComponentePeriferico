spring.application.name=ComponentePeriferico

# URL DEL CENTRAL
central.api.base-url=https://backend.web.elasticloud.uy/

# --- CONFIGURACION DE BASE DE DATOS ---
spring.datasource.url=jdbc:${DB_PUBLIC_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- SERVIDOR LOCAL LO CAMBIE A 8080 PORQUE SI NO EL RAILWAY SE ENLOQUECE Y NO ANDA ---
server.port=8080

# URL PUBLICA DEL PERIFERICO (usada por el central para acceder a documentos)
periferico.public.base-url=https://p1.enbondi.xyz

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# JWT Configuration
app.jwt.secret=mySecretKeyThatShouldBeAtLeast256BitsLongForHS256AlgorithmAndChangedInProduction123456789012345678901234567890123456789012345678901234567890
app.jwt.expiration=86400000
app.jwt.refreshExpiration=604800000

app.auth.filter.disable=false

# COMPARTIDO CON EL CENTRAL
central.api.secret=myOtherSecretKeyThatShouldBeAtLeast256BitsLongForHS256AlgorithmAndChangedInProduction